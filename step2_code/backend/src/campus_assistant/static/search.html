<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>证据搜索</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;color:#333;line-height:1.6}
.header{background:#fff;border-bottom:1px solid #ddd;padding:12px 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10}
.header h1{font-size:18px;font-weight:600}
.header a{font-size:13px;color:#1976d2;text-decoration:none}
.header a:hover{text-decoration:underline}
.notice{background:#e3f2fd;padding:8px 16px;font-size:13px;color:#1565c0}
.container{max-width:900px;margin:0 auto;padding:16px}
.search-form{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.search-form input[type="text"]{flex:1;padding:10px;border:1px solid #ccc;border-radius:4px;font-size:15px}
.search-form button{padding:10px 20px;background:#1976d2;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:15px}
.search-form button:hover{background:#1565c0}
.search-form button:disabled{background:#bbb;cursor:not-allowed}
.mode-selector{display:flex;gap:4px;margin-bottom:12px}
.mode-btn{padding:6px 16px;border:1px solid #ccc;background:#fff;border-radius:4px;cursor:pointer;font-size:13px}
.mode-btn:hover{background:#f0f0f0}
.mode-btn.active{background:#1976d2;color:#fff;border-color:#1976d2}
.mode-btn:disabled{opacity:0.5;cursor:not-allowed}
.mode-btn.active:disabled{background:#a0c4e8;border-color:#a0c4e8}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:10px;background:#fff;border:1px solid #ddd;border-radius:6px}
.filter-bar label{font-size:13px;color:#555}
.filter-bar select,.filter-bar input[type="date"]{padding:6px 8px;border:1px solid #ccc;border-radius:4px;font-size:13px;background:#fff}
.filter-clear-btn{padding:6px 14px;border:1px solid #999;background:#fff;color:#555;border-radius:4px;cursor:pointer;font-size:13px}
.filter-clear-btn:hover{background:#f0f0f0}
.status-bar{padding:8px 16px;font-size:13px;border-radius:4px;margin-bottom:12px}
.status-ready{background:#e8f5e9;color:#2e7d32}
.status-partial{background:#fff3e0;color:#e65100}
.status-failed{background:#ffebee;color:#c62828}
.status-unconfigured{background:#f5f5f5;color:#757575}
.errors-box{background:#ffebee;border:1px solid #ef9a9a;border-radius:6px;padding:12px;margin-bottom:12px}
.errors-box h4{color:#c62828;margin-bottom:6px;font-size:14px}
.errors-box ul{margin-left:20px;font-size:13px}
.query-label{font-size:13px;color:#666;margin-bottom:12px}
.filter-notes{font-size:12px;color:#8a6d3b;background:#fcf8e3;border:1px solid #faebcc;border-radius:4px;padding:8px 12px;margin-bottom:12px}
.hit-card{background:#fff;border:1px solid #ddd;border-radius:6px;padding:16px;margin-bottom:12px}
.hit-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hit-rank{font-size:13px;color:#1976d2;font-weight:600}
.hit-score{font-size:12px;color:#666}
.hit-title{font-size:15px;font-weight:500;margin-bottom:4px}
.hit-meta{font-size:12px;color:#666;margin-bottom:8px}
.hit-text{font-size:14px;white-space:pre-wrap;word-break:break-word;background:#fafafa;padding:10px;border-radius:4px;margin-bottom:8px;border-left:3px solid #1976d2}
.hit-source{font-size:12px;color:#666;margin-bottom:8px}
.hit-source a{color:#1976d2;text-decoration:none}
.hit-source a:hover{text-decoration:underline}
.synthetic-badge{font-size:11px;background:#fff3cd;color:#856404;padding:1px 6px;border-radius:3px;margin-left:4px}
.hit-actions{display:flex;gap:12px;align-items:center}
.hit-actions a{font-size:13px;color:#1976d2;text-decoration:none}
.hit-actions a:hover{text-decoration:underline}
details{margin-top:8px}
summary{font-size:13px;color:#1976d2;cursor:pointer}
summary:hover{text-decoration:underline}
.matched-terms{font-size:13px;margin-top:4px}
.matched-terms table{border-collapse:collapse;width:100%;margin-top:4px}
.matched-terms th,.matched-terms td{border:1px solid #ddd;padding:4px 8px;text-align:left;font-size:12px}
.matched-terms th{background:#f5f5f5}
.hybrid-info{font-size:12px;color:#666;margin-top:4px}
.empty-state{text-align:center;color:#999;padding:40px 20px}
.retry-btn{margin-top:8px;padding:6px 16px;border:1px solid #1976d2;background:#fff;color:#1976d2;border-radius:4px;cursor:pointer;font-size:13px}
.retry-btn:hover{background:#e3f2fd}
.loading{color:#666;text-align:center;padding:20px}
@media(max-width:600px){
  .container{padding:10px}
  .search-form{flex-direction:column}
  .hit-card{padding:12px}
  .mode-selector{flex-wrap:wrap}
  .filter-bar{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>
<div class="header">
  <h1>证据搜索</h1>
  <a href="/">首页</a>
  <a href="/preview">← 语料预览</a>
  <a href="/ask" id="nav-ask">证据整理</a>
  <a href="/procedures">办事指南</a>
  <a href="/compare">版本对比</a>
</div>
<div class="notice">证据检索结果，不是自动生成的政策答案，也不是资格认证。</div>
<div class="container">
  <div class="mode-selector" id="mode-selector">
    <button class="mode-btn active" data-mode="bm25">关键词</button>
    <button class="mode-btn" data-mode="dense">语义</button>
    <button class="mode-btn" data-mode="hybrid">混合</button>
  </div>
  <div class="filter-bar" id="filter-bar">
    <label for="filter-campus">校区</label>
    <select id="filter-campus" aria-label="校区"><option value="">不限</option></select>
    <label for="filter-student-type">学生类型</label>
    <select id="filter-student-type" aria-label="学生类型"><option value="">不限</option></select>
    <label for="filter-admission-year">入学年份</label>
    <select id="filter-admission-year" aria-label="入学年份"><option value="">不限</option></select>
    <label for="filter-as-of-date">查询日期</label>
    <input type="date" id="filter-as-of-date" aria-label="查询日期">
    <label class="filter-label" for="include-unknown-type" title="开启后，学生类型未标注的资料作为参考纳入正式检索并标注「适用范围尚未核实」；关闭回到严格准入"><input type="checkbox" id="include-unknown-type" checked> 纳入学生类型未标注资料（参考）</label>
    <button type="button" class="filter-clear-btn" id="clear-filters-btn">清除条件</button>
  </div>
  <div class="filter-bar" id="source-bar">
    <label for="source-mode">资料范围</label>
    <select id="source-mode" aria-label="资料范围">
      <option value="all">全部资料</option>
      <option value="doc">指定文件</option>
    </select>
    <select id="source-doc" aria-label="指定文件" disabled><option value="">（请选择文件）</option></select>
    <button type="button" class="filter-clear-btn" id="clear-source-btn">清除选择</button>
    <span class="ev-budget" id="source-hint">未选择指定文件：检索范围为全部资料。</span>
  </div>
  <div class="search-form" id="search-form">
    <label for="query-input" class="sr-only" style="position:absolute;left:-9999px">搜索关键词</label>
    <input type="text" id="query-input" placeholder="输入关键词，如：缓考申请" aria-label="搜索关键词">
    <button type="button" id="search-btn">搜索</button>
  </div>
  <div id="status-area"></div>
  <div id="results-area"></div>
  <div id="candidate-area"></div>
</div>
<script>
(function(){
  var API = '/api/v1/search';
  var input = document.getElementById('query-input');
  var btn = document.getElementById('search-btn');
  var statusArea = document.getElementById('status-area');
  var resultsArea = document.getElementById('results-area');
  var modeSelector = document.getElementById('mode-selector');
  var campusSel = document.getElementById('filter-campus');
  var typeSel = document.getElementById('filter-student-type');
  var yearSel = document.getElementById('filter-admission-year');
  var dateInput = document.getElementById('filter-as-of-date');
  var clearBtn = document.getElementById('clear-filters-btn');
  var sourceModeSel = document.getElementById('source-mode');
  var sourceDocSel = document.getElementById('source-doc');
  var clearSourceBtn = document.getElementById('clear-source-btn');
  var sourceHint = document.getElementById('source-hint');
  var askNav = document.getElementById('nav-ask');
  var searchSeq = 0;
  var statusSeq = 0;
  var lastSubmittedQuery = '';
  var lastSubmittedTopK = 5;
  var lastSubmittedMode = 'bm25';
  var lastSubmittedFilters = null;
  var lastSubmittedDocumentId = null;
  var lastSubmittedIncludeUnknown = true; // T043：提交时快照（默认开）
  var includeUnknownEl = document.getElementById('include-unknown-type');
  // T043-R1：导航使用「当前显示上下文」快照——URL 恢复/提交结果/历史查看各
  // 自绑定；不随控件编辑变化，也不影响重试/转摘录的 lastSubmitted 原请求快照。
  var navContext = { query: '', filters: null, documentId: null, includeUnknown: true };
  var selectedMode = 'bm25';
  var availableModes = [];
  var lastFilterOptionsJson = '';
  var sourceCatalog = [];
  var lastCatalogJson = '';

  function ce(tag, cls, text){
    var el = document.createElement(tag);
    if(cls) el.className = cls;
    if(text !== undefined) el.textContent = text;
    return el;
  }

  function formatScore(s){ return (Math.round(s * 1000) / 1000).toFixed(3); }
  function formatDate(v){ return v || '未标注'; }
  function formatEndDate(v){ return v || '未标注截止'; }

  function scoreLabel(mode){
    if(mode === 'dense') return '语义相似度';
    if(mode === 'hybrid') return '融合排序分';
    return '关键词匹配分';
  }

  function scopeText(scope){
    if(!scope) return '未标注';
    var parts = [];
    if(scope.campus && scope.campus.length) parts.push('校区：' + scope.campus.join('、'));
    if(scope.student_type && scope.student_type.length) parts.push('类型：' + scope.student_type.join('、'));
    if(scope.admission_years && scope.admission_years.length) parts.push('年级：' + scope.admission_years.join('、'));
    return parts.length ? parts.join('；') : '未标注';
  }

  function currentFilters(){
    return {
      campus: campusSel.value ? campusSel.value : null,
      student_type: typeSel.value ? typeSel.value : null,
      admission_year: yearSel.value ? parseInt(yearSel.value, 10) : null,
      as_of_date: dateInput.value ? dateInput.value : null
    };
  }

  function hasFilter(f){
    return !!f && (f.campus !== null || f.student_type !== null ||
      f.admission_year !== null || f.as_of_date !== null);
  }

  function filtersText(f){
    if(!hasFilter(f)) return '不限条件';
    var parts = [];
    if(f.campus) parts.push('校区=' + f.campus);
    if(f.student_type) parts.push('类型=' + f.student_type);
    if(f.admission_year !== null && f.admission_year !== undefined) parts.push('年级=' + f.admission_year);
    if(f.as_of_date) parts.push('查询日期=' + f.as_of_date);
    return parts.join('　');
  }

  function clearFilters(){
    campusSel.value = '';
    typeSel.value = '';
    yearSel.value = '';
    dateInput.value = '';
  }

  // ---- 资料范围（T031）：用户显式选择单份文件；未选=全部资料 ----
  // T031-R1：URL 参数进入「待恢复快照」，等选项/目录就绪后再一次性应用——
  // 原生 select 在选项尚不存在时写 value 会丢值；失效 ID 保留原始值
  // （提交携带原 ID 由服务端 422 校验），绝不静默转 null 执行全库检索。
  var restorePending = {
    filters: null,
    documentId: null,
    filtersApplied: false,
    documentApplied: false,
    catalogFailed: false,
    filterWarnings: []
  };

  function currentDocumentId(){
    return (sourceModeSel.value === 'doc' && sourceDocSel.value) ? sourceDocSel.value : null;
  }

  function sourceSelectionError(){
    if(sourceModeSel.value === 'doc' && !sourceDocSel.value){
      return '「指定文件」模式下还没有选择文件：请选择文件，或显式切换回「全部资料」；不会自动按全部资料执行。';
    }
    return null;
  }

  function applyRestoreAfterStatusFailure(){
    // T031-R1：状态加载失败也要完成待恢复条件应用（以 ghost 保留值），不得永久卡住提交
    tryApplyRestoreFilters();
    if(restorePending.filterWarnings.length){
      statusArea.appendChild(ce('div', 'notice',
        '链接携带的筛选条件按原值保留（当前选项未知，仍按该条件提交）：' + restorePending.filterWarnings.join('、')));
    }
    updateSourceHint();
  }

  function restoreBlockMessage(){
    if(restorePending.filters && !restorePending.filtersApplied){
      return '正在恢复链接中的筛选条件（等待语料状态/选项加载），暂不提交以免丢失条件。';
    }
    if(restorePending.documentId && !restorePending.documentApplied){
      return '正在恢复链接中的来源文件（等待目录确认），暂不提交以免丢失或放宽条件。';
    }
    return null;
  }

  function addSelectValue(sel, value, labelText){
    // Native semantics: values stick only via an existing/added option.
    var opt = document.createElement('option');
    opt.value = value;
    opt.textContent = labelText;
    sel.appendChild(opt);
    sel.value = value;
  }

  function tryApplyRestoreFilters(){
    if(restorePending.filtersApplied || !restorePending.filters) return;
    var f = restorePending.filters;
    function applyOne(sel, value, fieldName){
      if(value === null || value === undefined || value === '') return;
      var vals = [];
      for(var i = 0; i < sel.children.length; i++) vals.push(String(sel.children[i].value));
      if(vals.indexOf(String(value)) >= 0){
        sel.value = String(value);
      } else {
        addSelectValue(sel, String(value), String(value) + '（已不在当前选项）');
        restorePending.filterWarnings.push(fieldName + '=' + value);
      }
    }
    applyOne(campusSel, f.campus, '校区');
    applyOne(typeSel, f.student_type, '学生类型');
    applyOne(yearSel, f.admission_year, '入学年份');
    if(f.as_of_date){ dateInput.value = f.as_of_date; }
    restorePending.filtersApplied = true;
  }

  function tryApplyRestoreDocument(){
    if(restorePending.documentApplied || !restorePending.documentId) return;
    var id = restorePending.documentId;
    sourceModeSel.value = 'doc';
    sourceDocSel.disabled = false;
    var known = sourceCatalog.some(function(e){ return e.document_id === id; });
    if(known){
      sourceDocSel.value = id; // 目录中的 option 已存在，原生语义保留
    } else {
      // 失效或目录未确认：保留原始 ID 为明确不可用选项（提交携带原值，服务端 422 校验）
      addSelectValue(sourceDocSel, id, id + (restorePending.catalogFailed ? '（目录未确认）' : '（已失效/不在当前目录）'));
    }
    restorePending.documentApplied = true;
    updateSourceHint();
  }

  function docLabel(e, withShortId){
    var t = e.title || e.document_id;
    var v = e.version_label ? '（' + e.version_label + '）' : '（无版本标注）';
    return t + v + (withShortId ? ' · ' + String(e.document_id).slice(0, 8) : '');
  }

  function fillSourceSelect(){
    var prev = sourceDocSel.value;
    var labels = {};
    sourceCatalog.forEach(function(e){
      var k = docLabel(e, false);
      labels[k] = (labels[k] || 0) + 1;
    });
    sourceDocSel.innerHTML = '';
    var ph = document.createElement('option');
    ph.value = '';
    ph.textContent = '（请选择文件）';
    sourceDocSel.appendChild(ph);
    sourceCatalog.forEach(function(e){
      var opt = document.createElement('option');
      opt.value = e.document_id;
      opt.textContent = docLabel(e, labels[docLabel(e, false)] > 1);
      sourceDocSel.appendChild(opt);
    });
    if(prev && sourceCatalog.some(function(e){ return e.document_id === prev; })){
      sourceDocSel.value = prev;
    } else if(prev){
      // Keep the constraint: ghost entry, never silently dropped to "all".
      addSelectValue(sourceDocSel, prev, prev + '（已不在当前目录）');
    }
    updateSourceHint();
  }

  function updateSourceHint(){
    if(sourceModeSel.value !== 'doc'){
      sourceHint.textContent = '未选择指定文件：检索范围为全部资料。';
      return;
    }
    var id = sourceDocSel.value;
    if(!id){
      sourceHint.textContent = '「指定文件」模式：请选择文件，或显式切换回「全部资料」；不会自动按全部资料执行。';
      return;
    }
    var entry = sourceCatalog.filter(function(e){ return e.document_id === id; })[0];
    if(entry){
      sourceHint.textContent = '仅在所选文件内检索（' + (entry.title || id) +
        (entry.version_label ? ' · ' + entry.version_label : ' · 无版本标注') +
        '）；不代表该版本现行有效。';
    } else if(restorePending.catalogFailed){
      sourceHint.textContent = '目录未确认（加载失败/未配置）：保留所选文件 ' + id +
        '，提交将携带该 ID 由服务端校验；不会默认为全部资料。';
    } else {
      sourceHint.textContent = '所选文件已不在当前目录（' + id + '）：保留该选择（提交携带原 ID 由服务端校验，' +
        '不会默认为全部资料）；请重新选择，或显式切换回「全部资料」。';
    }
  }

  function sourceScopeText(d){
    var ss = d.source_selection || {};
    if(!ss.selected) return '全部资料';
    var t = ss.title || ss.document_id || d.document_id;
    var v = ss.version_label ? '（' + ss.version_label + '）' : '（无版本标注）';
    return '指定文件：' + t + v;
  }

  async function loadSourceCatalog(){
    try {
      var r = await fetch(API + '/documents');
      if(r.ok){
        var d = await r.json();
        var docs = d.documents || [];
        var json = JSON.stringify(docs.map(function(e){ return e.document_id; }));
        if(json !== lastCatalogJson){ // keep in-flight edits
          lastCatalogJson = json;
          sourceCatalog = docs;
          fillSourceSelect();
        }
      } else {
        restorePending.catalogFailed = true;
      }
    } catch(e){
      restorePending.catalogFailed = true; // 目录失败不得静默取消待恢复 ID
    }
    tryApplyRestoreDocument();
    updateSourceHint();
  }

  // Rebuild one filter select from status options, preserving the user's
  // current selection. Returns vanished entries like "年级=2024" when the
  // selected value is no longer among the options — the constraint is kept
  // (and reported), never silently dropped.
  function fillSelect(sel, values, fieldName){
    var prev = sel.value;
    var vals = [];
    (values || []).forEach(function(v){ vals.push(String(v)); });
    sel.innerHTML = '';
    var optAll = document.createElement('option');
    optAll.value = '';
    optAll.textContent = '不限';
    sel.appendChild(optAll);
    vals.forEach(function(v){
      var opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      sel.appendChild(opt);
    });
    var vanished = [];
    if(prev && vals.indexOf(prev) < 0){
      var ghost = document.createElement('option');
      ghost.value = prev;
      ghost.textContent = prev + '（已不在当前选项）';
      sel.appendChild(ghost);
      sel.value = prev;
      vanished.push(fieldName + '=' + prev);
      return vanished;
    }
    sel.value = prev || '';
    return vanished;
  }

  function updateModeButtons(){
    var btns = modeSelector.querySelectorAll('.mode-btn');
    btns.forEach(function(b){
      var m = b.getAttribute('data-mode');
      b.classList.toggle('active', m === selectedMode);
      b.disabled = availableModes.indexOf(m) < 0;
    });
  }

  // Status loading
  async function loadStatus(){
    statusSeq++;
    var mySeq = statusSeq;
    try {
      var r = await fetch(API + '/status');
      if(mySeq !== statusSeq) return;
      if(!r.ok){
        statusArea.innerHTML = '';
        var wrap = ce('div');
        wrap.appendChild(ce('div', 'status-bar status-failed', '状态接口错误：HTTP ' + r.status));
        var retryBtn = ce('button', 'retry-btn', '重试');
        retryBtn.addEventListener('click', loadStatus);
        wrap.appendChild(retryBtn);
        statusArea.appendChild(wrap);
        applyRestoreAfterStatusFailure();
        return;
      }
      var d;
      try { d = await r.json(); } catch(je){
        if(mySeq !== statusSeq) return;
        statusArea.innerHTML = '';
        var wrap = ce('div');
        wrap.appendChild(ce('div', 'status-bar status-failed', '状态接口返回无效 JSON'));
        var retryBtn = ce('button', 'retry-btn', '重试');
        retryBtn.addEventListener('click', loadStatus);
        wrap.appendChild(retryBtn);
        statusArea.appendChild(wrap);
        applyRestoreAfterStatusFailure();
        return;
      }
      if(mySeq !== statusSeq) return;
      availableModes = d.available_modes || ['bm25'];
      updateModeButtons();
      // Only rebuild filter controls when the option set actually changed;
      // background status refreshes must never touch the user's selections
      // (including edits made while a search was in flight).
      var opts = d.filter_options || {};
      var optsJson = JSON.stringify(opts);
      var vanished = [];
      if(optsJson !== lastFilterOptionsJson){
        vanished = vanished
          .concat(fillSelect(campusSel, opts.campus, '校区'))
          .concat(fillSelect(typeSel, opts.student_type, '学生类型'))
          .concat(fillSelect(yearSel, opts.admission_year, '入学年份'));
        lastFilterOptionsJson = optsJson;
      }
      statusArea.innerHTML = '';
      var bar = ce('div', 'status-bar');
      var cls = {ready:'status-ready',partial:'status-partial',failed:'status-failed',unconfigured:'status-unconfigured'}[d.status]||'';
      bar.className = 'status-bar ' + cls;
      var labels = {ready:'就绪',partial:'部分成功',failed:'失败',unconfigured:'未配置'};
      var txt = '语料状态：' + labels[d.status] + '　已解析：' + d.parsed_count + '　分块：' + d.chunk_count + '　有效索引：' + d.indexed_chunk_count;
      if(d.embedding_model) txt += '　模型：' + d.embedding_model;
      if(d.truncated_chunk_count > 0) txt += '　截断块：' + d.truncated_chunk_count;
      bar.textContent = txt;
      statusArea.appendChild(bar);
      // T031-R1：选项就绪后一次性应用待恢复条件；缺失项保留并提示（不放宽）
      tryApplyRestoreFilters();
      if(restorePending.filterWarnings.length){
        var rw = ce('div', 'notice', '链接携带的筛选条件已不在当前选项，仍按该条件提交（仅手动更改或清除会取消）：' + restorePending.filterWarnings.join('、'));
        rw.style.marginTop = '4px';
        statusArea.appendChild(rw);
      }
      if(vanished.length){
        var vanishNotice = ce('div', 'notice', '以下筛选条件已不在当前语料选项中，仍按该条件筛选（仅手动更改或清除条件会取消）：' + vanished.join('、'));
        vanishNotice.style.marginTop = '4px';
        statusArea.appendChild(vanishNotice);
      }
      if(d.embedding_error){
        var embNotice = ce('div', 'notice', '向量模型不可用：' + d.embedding_error + '（关键词检索与原文预览不受影响）');
        embNotice.style.marginTop = '4px';
        statusArea.appendChild(embNotice);
      }
      if(d.truncated_chunk_count > 0){
        var truncNotice = ce('div', 'notice', d.truncated_chunk_count + ' 个长块超出模型 token 上限，向量计算可能仅部分参与；原文与分块文本未被截短。');
        truncNotice.style.marginTop = '4px';
        statusArea.appendChild(truncNotice);
      }
      if(d.synthetic_count > 0){
        var synNotice;
        if(d.synthetic_count >= d.parsed_count){
          synNotice = ce('div', 'notice', '⚠ 全部为合成测试资料，不代表四川农业大学真实政策。');
        } else {
          synNotice = ce('div', 'notice', '⚠ 部分文档为合成测试资料（' + d.synthetic_count + '/' + d.parsed_count + '），不代表真实学校政策。');
        }
        synNotice.style.marginTop = '4px';
        statusArea.appendChild(synNotice);
      }
      if(d.errors && d.errors.length){
        var eb = ce('div', 'errors-box');
        eb.appendChild(ce('h4', '', '错误明细'));
        var ul = ce('ul');
        d.errors.forEach(function(e){ ul.appendChild(ce('li', '', (e.document_id?'['+e.document_id+'] ':'') + (e.message||e.code||''))); });
        eb.appendChild(ul);
        statusArea.appendChild(eb);
      }
    } catch(e){
      if(mySeq !== statusSeq) return;
      statusArea.innerHTML = '';
      var wrap = ce('div');
      wrap.appendChild(ce('div', 'status-bar status-failed', '无法获取状态：网络错误'));
      var retryBtn = ce('button', 'retry-btn', '重试');
      retryBtn.addEventListener('click', loadStatus);
      wrap.appendChild(retryBtn);
      statusArea.appendChild(wrap);
      applyRestoreAfterStatusFailure();
    }
  }

  // Search
  async function doSearch(query, topK, mode, filters, includeUnknown){
    if(query === undefined) query = input.value;
    if(topK === undefined) topK = 5;
    if(mode === undefined) mode = selectedMode;
    if(filters === undefined) filters = currentFilters();
    if(includeUnknown === undefined) includeUnknown = includeUnknownEl ? includeUnknownEl.checked : true;
    searchSeq++;
    var mySeq = searchSeq;
    if(!query.trim()){
      resultsArea.innerHTML = '';
      resultsArea.appendChild(ce('div','empty-state','请输入搜索关键词'));
      btn.disabled = false;
      return;
    }
    // T031-R1：链接条件恢复未完成/指定文件模式未选文件 → 不发请求（不丢条件、不静默全库）
    var blocked = restoreBlockMessage() || sourceSelectionError();
    if(blocked){
      resultsArea.innerHTML = '';
      resultsArea.appendChild(ce('div','empty-state', blocked));
      btn.disabled = false;
      return;
    }
    lastSubmittedQuery = query;
    lastSubmittedTopK = topK;
    lastSubmittedMode = mode;
    lastSubmittedFilters = filters;
    lastSubmittedDocumentId = currentDocumentId();
    lastSubmittedIncludeUnknown = includeUnknown;
    // T043-R1：本次提交成为当前显示上下文（导航按此快照，不随控件后续编辑变化）
    navContext = { query: query, filters: filters, documentId: currentDocumentId(), includeUnknown: !!includeUnknown };
    clearCandidates(); // 新正式请求清空旧候选
    btn.disabled = true;
    resultsArea.innerHTML = '';
    resultsArea.appendChild(ce('div','loading','搜索中…'));
    await executeSearch(query, topK, mode, filters, mySeq, lastSubmittedDocumentId, lastSubmittedIncludeUnknown);
    if(mySeq === searchSeq) btn.disabled = false;
    updateNavLinks();
  }

  function retrySearchParams(){
    searchSeq++;
    var mySeq = searchSeq;
    btn.disabled = true;
    resultsArea.innerHTML = '';
    resultsArea.appendChild(ce('div','loading','搜索中…'));
    // Retry uses the submitted snapshot (incl. source selection & 新开关) — never the edited controls.
    executeSearch(lastSubmittedQuery, lastSubmittedTopK, lastSubmittedMode, lastSubmittedFilters, mySeq, lastSubmittedDocumentId, lastSubmittedIncludeUnknown).then(function(){
      if(mySeq === searchSeq) btn.disabled = false;
    });
  }

  async function executeSearch(query, topK, mode, filters, mySeq, documentId, includeUnknown){
    try {
      var body = {query: query, top_k: topK, mode: mode};
      if(hasFilter(filters)) body.filters = filters;
      if(documentId) body.document_id = documentId;
      body.include_unknown_student_type = !!includeUnknown;
      var r = await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
      if(mySeq !== searchSeq) return;
      if(r.status === 503){
        var err;
        try { err = await r.json(); } catch(je){
          if(mySeq !== searchSeq) return;
          resultsArea.innerHTML = '';
          var wrap = ce('div');
          wrap.appendChild(ce('div','empty-state','接口返回无效 JSON'));
          var retryBtn = ce('button','retry-btn','重试');
          retryBtn.addEventListener('click', retrySearchParams);
          wrap.appendChild(retryBtn);
          resultsArea.appendChild(wrap);
          return;
        }
        if(mySeq !== searchSeq) return;
        resultsArea.innerHTML = '';
        var wrap = ce('div');
        wrap.appendChild(ce('div','empty-state', err.message || '检索不可用'));
        var retryBtn = ce('button','retry-btn','重试');
        retryBtn.addEventListener('click', retrySearchParams);
        wrap.appendChild(retryBtn);
        resultsArea.appendChild(wrap);
        return;
      }
      if(!r.ok){
        if(mySeq !== searchSeq) return;
        var msg = '接口错误：HTTP ' + r.status;
        try {
          var ej = await r.json();
          if(ej && ej.message) msg = ej.message;
        } catch(je2){ /* keep HTTP status text */ }
        if(mySeq !== searchSeq) return;
        resultsArea.innerHTML = '';
        var wrap = ce('div');
        wrap.appendChild(ce('div','empty-state', msg));
        var retryBtn = ce('button','retry-btn','重试');
        retryBtn.addEventListener('click', retrySearchParams);
        wrap.appendChild(retryBtn);
        resultsArea.appendChild(wrap);
        return;
      }
      var d;
      try { d = await r.json(); } catch(je){
        if(mySeq !== searchSeq) return;
        resultsArea.innerHTML = '';
        var wrap = ce('div');
        wrap.appendChild(ce('div','empty-state','返回无效 JSON'));
        var retryBtn = ce('button','retry-btn','重试');
        retryBtn.addEventListener('click', retrySearchParams);
        wrap.appendChild(retryBtn);
        resultsArea.appendChild(wrap);
        return;
      }
      if(mySeq !== searchSeq) return;
      loadStatus();
      renderResults(d, query, mode);
      renderCandidatePanel(d, query, mode, d.document_id); // T038：绑定正式结果快照，仅展示面板不自动请求
    } catch(e){
      if(mySeq !== searchSeq) return;
      resultsArea.innerHTML = '';
      var wrap = ce('div');
      wrap.appendChild(ce('div','empty-state','网络错误'));
      var retryBtn = ce('button','retry-btn','重试');
      retryBtn.addEventListener('click', retrySearchParams);
      wrap.appendChild(retryBtn);
      resultsArea.appendChild(wrap);
    }
  }

  function appendClearAction(wrap){
    var clearAction = ce('button', 'filter-clear-btn', '清除条件');
    clearAction.addEventListener('click', clearFilters);
    wrap.appendChild(clearAction);
  }

  // ---- T038: 显式候选查看（独立区；仅用户点击才请求；绑定正式结果快照）----
  var candidateArea = document.getElementById('candidate-area');
  var candidateSeq = 0;
  var candidateSnapshot = null;

  function clearCandidates(){
    candidateSeq++;          // 旧异步响应作废
    candidateSnapshot = null;
    if(candidateArea) candidateArea.innerHTML = '';
  }

  function candidateHitCard(h){
    var div = ce('div', 'hit-card');
    var chunk = h.chunk || {};
    var meta = chunk.metadata || {};
    var unk = (h.unknown_dimensions || []).join('、');
    var h4 = ce('div', 'step-title');
    h4.textContent = (meta.title || chunk.document_id || '') + (meta.version_label ? '（' + meta.version_label + '）' : '');
    div.appendChild(h4);
    div.appendChild(ce('div', 'unspecified',
      '未核实维度：' + (unk || '未知') + '　' + (h.uncertainty_note || '') +
      '　来源适用范围：' + ((meta.scope && (meta.scope.student_type || []).length) ? meta.scope.student_type.join('、') : '未标注（含本科与否未核实）')));
    var loc = (chunk.locator && chunk.locator.type === 'pdf_page') ? ('PDF 第 ' + chunk.locator.page + ' 页') : (chunk.locator ? JSON.stringify(chunk.locator) : '未知定位');
    div.appendChild(ce('div', 'hit-meta', '定位：' + loc));
    div.appendChild(ce('div', 'hit-text', chunk.text || ''));
    var a = ce('a');
    a.href = h.preview_url || ('/preview#' + chunk.document_id + '/' + chunk.block_id);
    a.textContent = '查看原文';
    div.appendChild(a);
    return div;
  }

  function renderCandidatePanel(d, query, mode, documentId){
    if(!candidateArea) return;
    clearCandidates();
    if(!d) return;
    candidateSnapshot = {
      query: query, mode: mode, topK: 5,
      filters: d.filters || null,
      documentId: documentId || null,
      // T043：候选按本次正式结果 snapshot 的准入模式去重；旧记录缺字段=当时 strict
      includeUnknown: ('include_unknown_student_type' in d) ? !!d.include_unknown_student_type : false
    };
    var wrap = ce('div', 'disclaimer');
    wrap.appendChild(ce('b', '', '查看未核实资料（独立候选）'));
    wrap.appendChild(document.createTextNode(
      '　候选未通过所选日期或学生类型条件核实，仅供原文核对，不作为已确认适用的答案依据；不并入正式排名/证据/自动答案，复制与历史保存仍只含正式结果。'));
    var f = candidateSnapshot.filters || {};
    var row = ce('div');
    var cbDate = document.createElement('input');
    cbDate.type = 'checkbox'; cbDate.id = 'cand-date';
    cbDate.disabled = !f.as_of_date;
    var lbDate = document.createElement('label');
    lbDate.textContent = f.as_of_date ? '日期未核实（本结果筛选：查询日期=' + f.as_of_date + '）' : '日期未核实（本结果未使用日期筛选，不可选）';
    row.appendChild(cbDate); row.appendChild(lbDate);
    row.appendChild(document.createTextNode('　'));
    var cbType = document.createElement('input');
    cbType.type = 'checkbox'; cbType.id = 'cand-stype';
    cbType.disabled = !f.student_type;
    var lbType = document.createElement('label');
    lbType.textContent = f.student_type ? '学生类型未核实（本结果筛选：类型=' + f.student_type + '）' : '学生类型未核实（本结果未使用类型筛选，不可选）';
    row.appendChild(cbType); row.appendChild(lbType);
    wrap.appendChild(row);
    var btnC = ce('button', 'filter-clear-btn', '查看候选原文');
    var out = ce('div');
    btnC.addEventListener('click', function(){
      var dims = [];
      if(!cbDate.disabled && cbDate.checked) dims.push('date');
      if(!cbType.disabled && cbType.checked) dims.push('student_type');
      if(!dims.length){
        out.innerHTML = '';
        out.appendChild(ce('div', 'empty-state', '请先勾选与本结果筛选对应的未核实维度。'));
        return;
      }
      fetchCandidates(dims, out);
    });
    wrap.appendChild(btnC);
    wrap.appendChild(out);
    candidateArea.appendChild(wrap);
  }

  async function fetchCandidates(dims, out){
    if(!candidateSnapshot) return;
    candidateSeq++;
    var mySeq = candidateSeq;
    out.innerHTML = '';
    out.appendChild(ce('div', 'loading', '候选加载中…'));
    try {
      var body = {
        query: candidateSnapshot.query, mode: candidateSnapshot.mode,
        top_k: candidateSnapshot.topK, uncertainty_dimensions: dims,
        include_unknown_student_type: !!candidateSnapshot.includeUnknown
      };
      if(hasFilter(candidateSnapshot.filters)) body.filters = candidateSnapshot.filters;
      if(candidateSnapshot.documentId) body.document_id = candidateSnapshot.documentId;
      var r = await fetch('/api/v1/search/candidates', {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
      });
      if(mySeq !== candidateSeq) return; // 旧响应不得挂到新结果
      out.innerHTML = '';
      if(!r.ok){
        var msg = '候选加载失败（正式结果不受影响）';
        try { var ej = await r.json(); if(ej && ej.message) msg = '候选加载失败：' + ej.message; } catch(e2){}
        if(mySeq !== candidateSeq) return;
        out.appendChild(ce('div', 'empty-state', msg));
        var rb = ce('button', 'retry-btn', '按候选快照重试');
        rb.addEventListener('click', function(){ fetchCandidates(dims, out); });
        out.appendChild(rb);
        return;
      }
      var cd = await r.json();
      if(mySeq !== candidateSeq) return;
      out.appendChild(ce('div', 'disclaimer', cd.disclaimer || ''));
      out.appendChild(ce('div', 'hit-meta',
        '候选快照：查询「' + cd.query + '」　条件：' + filtersText(cd.filters) +
        '　来源：' + (cd.document_id ? ('指定文件 ' + cd.document_id.slice(0, 8) + '…') : '全部资料') +
        '　维度：' + (cd.uncertainty_dimensions || []).join('、')));
      if(!cd.hits || cd.hits.length === 0){
        out.appendChild(ce('div', 'empty-state', '当前条件下没有这些未核实候选资料（不代表学校无规定）。'));
        return;
      }
      out.appendChild(ce('div', 'hit-meta',
        '候选文档 ' + (cd.candidate_summary ? cd.candidate_summary.candidate_document_count : '?') + ' 份（严格准入 ' +
        (cd.candidate_summary ? cd.candidate_summary.strict_allowed_count : '?') + ' 份已排除；' +
        (cd.candidate_summary ? cd.candidate_summary.counting_rules : '') + '）'));
      (cd.hits || []).forEach(function(h){ out.appendChild(candidateHitCard(h)); });
    } catch(e){
      if(mySeq !== candidateSeq) return;
      out.innerHTML = '';
      out.appendChild(ce('div', 'empty-state', '候选加载失败：网络错误（正式结果不受影响）'));
      var rb = ce('button', 'retry-btn', '按候选快照重试');
      rb.addEventListener('click', function(){ fetchCandidates(dims, out); });
      out.appendChild(rb);
    }
  }

  function renderResults(d, query, mode){
    resultsArea.innerHTML = '';
    var hitCount = (d.hits && d.hits.length) || 0;
    // Condition line reflects the submitted query's snapshot (response echo),
    // not the current control values — later edits must not rewrite it.
    var admissionLabel = ('include_unknown_student_type' in d)
      ? (d.include_unknown_student_type ? '参考准入（含学生类型未标注资料）' : '严格准入')
      : '严格准入（旧记录未含模式字段，按当时 strict 显示）';
    var ql = ce('div', 'query-label',
      '查询：' + query + '　模式：' + ({bm25:'关键词',dense:'语义',hybrid:'混合'}[mode]||mode) +
      '　条件：' + filtersText(d.filters) + '　来源：' + sourceScopeText(d) + '　结果：' + hitCount + ' 条');
    resultsArea.appendChild(ql);
    resultsArea.appendChild(ce('div', 'filter-notes', '准入模式（快照）：' + admissionLabel));

    if(d.filter_summary && d.filter_summary.notes && d.filter_summary.notes.length){
      var notesDiv = ce('div', 'filter-notes', d.filter_summary.notes.join('　'));
      resultsArea.appendChild(notesDiv);
    }
    if(d.source_selection && d.source_selection.selected){
      var ss = d.source_selection;
      var ssNotes = (ss.notes || []).slice();
      if(ss.is_admitted === false){
        ssNotes.push('来源选择与适用条件求交后无准入依据（不取消筛选、不回退其他文件）。');
      }
      if(ssNotes.length){
        resultsArea.appendChild(ce('div', 'filter-notes', ssNotes.join('　')));
      }
    }

    if(!d.hits || d.hits.length === 0){
      var wrap = ce('div');
      var ss = d.source_selection || {};
      if(ss.selected && ss.is_admitted === false){
        wrap.appendChild(ce('div','empty-state','所选文件被适用条件排除，无准入资料（不是“文件内无命中”，也不是学校无规定）'));
        appendClearAction(wrap);
        var clearSrc = ce('button', 'filter-clear-btn', '清除选择');
        clearSrc.addEventListener('click', function(){
          sourceModeSel.value = 'all';
          sourceDocSel.value = '';
          sourceDocSel.disabled = true;
          updateSourceHint();
        });
        wrap.appendChild(clearSrc);
      } else if(ss.selected && ss.allowed_after_selection === 0){
        wrap.appendChild(ce('div','empty-state','所选文件无准入资料（不是学校无规定）'));
        appendClearAction(wrap);
      } else if(ss.selected){
        wrap.appendChild(ce('div','empty-state','所选文件内没有检索命中（不代表学校无规定）'));
      } else if(d.filter_summary && d.filter_summary.active && d.filter_summary.allowed_count === 0){
        wrap.appendChild(ce('div','empty-state','没有满足所选条件的资料'));
        appendClearAction(wrap);
      } else if(d.filter_summary && d.filter_summary.active){
        wrap.appendChild(ce('div','empty-state','满足条件的资料中没有检索命中'));
        appendClearAction(wrap);
      } else if(mode === 'bm25' && (!d.query_tokens || d.query_tokens.length === 0)){
        wrap.appendChild(ce('div','empty-state','无有效搜索词（输入内容不包含可检索的汉字或字母数字）'));
      } else if(d.indexed_chunk_count === 0){
        wrap.appendChild(ce('div','empty-state','无有效索引内容，无法匹配'));
      } else {
        wrap.appendChild(ce('div','empty-state','无匹配结果'));
      }
      resultsArea.appendChild(wrap);
      return;
    }

    d.hits.forEach(function(hit){
      var card = ce('div', 'hit-card');
      var hdr = ce('div', 'hit-header');
      hdr.appendChild(ce('span', 'hit-rank', '#' + hit.rank));
      hdr.appendChild(ce('span', 'hit-score', scoreLabel(mode) + '：' + formatScore(hit.score)));
      card.appendChild(hdr);
      var chunk = hit.chunk;
      var meta = chunk.metadata || {};
      var titleEl = ce('div', 'hit-title');
      titleEl.textContent = meta.title || chunk.document_id;
      if(meta.is_synthetic) titleEl.appendChild(ce('span', 'synthetic-badge', '合成'));
      card.appendChild(titleEl);
      // T043：参考命中固定状态说明（普通命中无此字段=旧协议）
      if(hit.student_type_status){
        card.appendChild(ce('div', 'filter-notes', '⚠ ' + hit.student_type_status + '（参考依据，非适用性确认）'));
      }
      var metaLine = [];
      if(meta.source_site) metaLine.push(meta.source_site);
      if(meta.version_label) metaLine.push(meta.version_label);
      if(chunk.locator && chunk.locator.type === 'pdf_page') metaLine.push('PDF 第 ' + chunk.locator.page + ' 页');
      if(metaLine.length) card.appendChild(ce('div', 'hit-meta', metaLine.join(' · ')));
      var datesDiv = ce('div', 'hit-meta');
      datesDiv.textContent = '发布：' + formatDate(meta.published_at) + '　生效：' + formatDate(meta.effective_from) + '　失效：' + formatEndDate(meta.effective_to);
      card.appendChild(datesDiv);
      card.appendChild(ce('div', 'hit-text', chunk.text));
      var srcDiv = ce('div', 'hit-source');
      srcDiv.appendChild(document.createTextNode('适用范围：' + scopeText(meta.scope)));
      if(meta.source_url && meta.source_url.match(/^https?:\/\//)){
        srcDiv.appendChild(document.createTextNode('　'));
        var a = ce('a');
        a.href = meta.source_url; a.target = '_blank'; a.rel = 'noopener noreferrer';
        a.textContent = '来源链接';
        srcDiv.appendChild(a);
      }
      card.appendChild(srcDiv);
      var actions = ce('div', 'hit-actions');
      var previewA = ce('a');
      previewA.href = hit.preview_url;
      previewA.textContent = '查看原文';
      actions.appendChild(previewA);
      card.appendChild(actions);

      // Hybrid: show both ranks
      if(mode === 'hybrid' && (hit.bm25_rank || hit.dense_rank)){
        var hInfo = ce('div', 'hybrid-info');
        var parts = [];
        if(hit.bm25_rank) parts.push('关键词排名 #' + hit.bm25_rank);
        if(hit.dense_rank) parts.push('语义排名 #' + hit.dense_rank);
        hInfo.textContent = parts.join('　');
        card.appendChild(hInfo);
      }

      // Matched terms (BM25 only has them)
      if(hit.matched_terms && hit.matched_terms.length){
        var det = document.createElement('details');
        var summ = document.createElement('summary');
        summ.textContent = '匹配依据';
        det.appendChild(summ);
        var mtDiv = ce('div', 'matched-terms');
        var table = document.createElement('table');
        var thead = document.createElement('thead');
        thead.innerHTML = '<tr><th>词</th><th>词频</th><th>文档频率</th><th>IDF</th><th>贡献</th></tr>';
        table.appendChild(thead);
        var tbody = document.createElement('tbody');
        hit.matched_terms.forEach(function(mt){
          var tr = document.createElement('tr');
          [mt.term, mt.tf, mt.df, formatScore(mt.idf), formatScore(mt.contribution)].forEach(function(v){
            var td = document.createElement('td');
            td.textContent = v;
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        mtDiv.appendChild(table);
        det.appendChild(mtDiv);
        card.appendChild(det);
      }
      resultsArea.appendChild(card);
    });
  }

  // Mode selector
  modeSelector.addEventListener('click', function(e){
    var btn = e.target.closest('.mode-btn');
    if(!btn || btn.disabled) return;
    selectedMode = btn.getAttribute('data-mode');
    updateModeButtons();
  });

  btn.addEventListener('click', function(){ doSearch(); });
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter') doSearch(); });
  clearBtn.addEventListener('click', function(){ clearFilters(); });
  // 资料范围控件：编辑不触发搜索/生成；状态刷新不清空当前选择
  sourceModeSel.addEventListener('change', function(){
    sourceDocSel.disabled = sourceModeSel.value !== 'doc';
    if(sourceModeSel.value !== 'doc') sourceDocSel.value = '';
    updateSourceHint();
  });
  sourceDocSel.addEventListener('change', updateSourceHint);
  clearSourceBtn.addEventListener('click', function(){
    sourceModeSel.value = 'all';
    sourceDocSel.value = '';
    sourceDocSel.disabled = true;
    updateSourceHint();
  });
  // /search→/ask 互跳携带查询条件时，来源选择一并一致（用提交快照）
  function updateNavLinks(){
    if(!askNav) return;
    // T043-R1：导航链接按「当前显示上下文」快照重建（URL 恢复后无需提交即可原样跨页；
    // 控件编辑/后续请求不改写旧上下文导航）。
    var ctx = navContext;
    var parts = [];
    if(ctx.query) parts.push('query=' + encodeURIComponent(ctx.query));
    if(ctx.filters && hasFilter(ctx.filters)){
      if(ctx.filters.campus) parts.push('campus=' + encodeURIComponent(ctx.filters.campus));
      if(ctx.filters.student_type) parts.push('student_type=' + encodeURIComponent(ctx.filters.student_type));
      if(ctx.filters.admission_year !== null && ctx.filters.admission_year !== undefined) parts.push('admission_year=' + encodeURIComponent(ctx.filters.admission_year));
      if(ctx.filters.as_of_date) parts.push('as_of_date=' + encodeURIComponent(ctx.filters.as_of_date));
    }
    if(ctx.documentId) parts.push('document_id=' + encodeURIComponent(ctx.documentId));
    parts.push('include_unknown_type=' + (ctx.includeUnknown ? '1' : '0'));
    askNav.href = '/ask' + (parts.length ? '?' + parts.join('&') : '');
  }
  // T031: 互跳携带条件/来源参数时一并预填（query/filters/document_id 保持一致）
  // T031-R1：select 值只进待恢复快照，选项就绪后一次性应用（原生 select 早写丢值）
  function parseQueryParams(){
    var out = {};
    try {
      var qs = (typeof location !== 'undefined' && location.search) ? String(location.search).replace(/^\?/, '') : '';
      qs.split('&').forEach(function(pair){
        if(!pair) return;
        var kv = pair.split('=');
        out[decodeURIComponent(kv[0])] = decodeURIComponent((kv[1] || '').replace(/\+/g, ' '));
      });
    } catch(e){}
    return out;
  }
  var initParams = parseQueryParams();
  if(initParams.query){ input.value = initParams.query; }
  if(initParams.as_of_date){ dateInput.value = initParams.as_of_date; }
  restorePending.filters = {
    campus: initParams.campus || null,
    student_type: initParams.student_type || null,
    admission_year: initParams.admission_year || null,
    as_of_date: initParams.as_of_date || null
  };
  if(!restorePending.filters.campus && !restorePending.filters.student_type &&
     !restorePending.filters.admission_year && !restorePending.filters.as_of_date){
    restorePending.filters = null;
  }
  if(initParams.document_id){
    // 保留原始 ID；失效/目录失败都不转 null——由 tryApplyRestoreDocument 应用
    restorePending.documentId = initParams.document_id;
    sourceModeSel.value = 'doc'; // source-mode 的 option 在静态 HTML 中，安全
    sourceDocSel.disabled = false;
    updateSourceHint();
  }
  // T043：跨页携带准入开关（缺省=页面默认开；新请求可切换）
  if(initParams.include_unknown_type !== undefined && includeUnknownEl){
    includeUnknownEl.checked = initParams.include_unknown_type !== '0';
  }
  // T043-R1：URL 恢复建立导航上下文（含等待目录/选项期间），无需提交即可原样跨页
  navContext = {
    query: initParams.query || '',
    filters: restorePending.filters,
    documentId: initParams.document_id || null,
    includeUnknown: initParams.include_unknown_type === undefined
      ? true
      : initParams.include_unknown_type !== '0'
  };
  updateNavLinks();
  loadSourceCatalog();
  loadStatus();
})();
</script>
</body>
</html>
