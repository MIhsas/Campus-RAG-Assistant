[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-assistant-backend"
version = "0.1.0"
description = "四川农业大学校园教务智能问答系统后端"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "pydantic>=2.9,<3",
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"campus_assistant" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
